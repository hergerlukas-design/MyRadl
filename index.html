<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#12100E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyRadl" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>MyRadl – MTB Manager</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('myradl-theme')
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
          var bg = dark ? '#12100E' : '#F4F2ED'
          document.documentElement.style.backgroundColor = bg
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', bg)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root" style="min-height: 100dvh"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
