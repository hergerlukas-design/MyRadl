name: Deploy to Fly.io

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Secrets werden als (gequotete) Env-Variablen übergeben, damit ein
      # versehentlicher Zeilenumbruch im Secret-Wert das Kommando nicht
      # zerteilt (sonst landet ein "--build-arg …" auf einer eigenen Zeile).
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Secret-Werte von versehentlichen CR/LF befreien, damit der
          # Build-Arg-Wert sauber (und nicht leer/kaputt) im Image ankommt.
          url="$(printf '%s' "$VITE_SUPABASE_URL" | tr -d '\r\n')"
          key="$(printf '%s' "$VITE_SUPABASE_ANON_KEY" | tr -d '\r\n')"
          flyctl deploy --remote-only \
            --build-arg VITE_SUPABASE_URL="$url" \
            --build-arg VITE_SUPABASE_ANON_KEY="$key"
