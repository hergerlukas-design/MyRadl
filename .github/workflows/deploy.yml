name: Deploy to Fly.io

on:
  push:
    branches:
      - master

# Nur ein Deploy gleichzeitig: startet ein neuer master-Push, wird ein noch
# laufender Deploy abgebrochen. Verhindert, dass zwei parallele `flyctl deploy`
# um dieselbe Fly-Release konkurrieren (führte bisher zu abgebrochenen Runs).
concurrency:
  group: deploy-fly-io
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Secrets werden als (gequotete) Env-Variablen übergeben, damit ein
      # versehentlicher Zeilenumbruch im Secret-Wert das Kommando nicht
      # zerteilt (sonst landet ein "--build-arg …" auf einer eigenen Zeile).
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Secret-Werte von versehentlichen CR/LF befreien, damit der
          # Build-Arg-Wert sauber (und nicht leer/kaputt) im Image ankommt.
          url="$(printf '%s' "$VITE_SUPABASE_URL" | tr -d '\r\n')"
          key="$(printf '%s' "$VITE_SUPABASE_ANON_KEY" | tr -d '\r\n')"
          # Sichere Diagnose: nur Länge/Schema loggen, niemals die Werte selbst.
          echo "diag: VITE_SUPABASE_URL length=${#url}"
          case "$url" in
            https://*|http://*) echo "diag: url scheme=ok" ;;
            "") echo "diag: url is EMPTY (Secret nicht/falsch gesetzt)" ;;
            *) echo "diag: url MISSING http(s):// scheme" ;;
          esac
          echo "diag: VITE_SUPABASE_ANON_KEY length=${#key}"
          flyctl deploy --remote-only \
            --build-arg VITE_SUPABASE_URL="$url" \
            --build-arg VITE_SUPABASE_ANON_KEY="$key"
